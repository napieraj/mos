name: CI

on:
  # workflow_dispatch lets us trigger the macOS runner manually from
  # the GitHub UI — useful for verifying Apple-SDK-dependent changes
  # (e.g. notification probe, mos_watch) without having to push a
  # branch or open a PR. The Hamburg dev environment has no Mac, so
  # CI is the primary macOS build path.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default token scope to read-only. Nothing in this workflow writes to
# the repo (no pushes, no comments, no release artifacts at present).
# Scoping down GITHUB_TOKEN is the cheap version of supply-chain
# defense — if a transitive dependency in any action ever turns
# malicious, it can't use the token to push to main.
permissions:
  contents: read

# One run per ref: a superseded push cancels the in-flight run. CI
# correctness never depends on run ordering; this is queue hygiene
# and (pre-public it was) minute hygiene — macOS billed at 10x.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (macos-latest)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (Node 24)
        with:
          persist-credentials: false

      - name: Toolchain versions
        run: |
          cmake --version
          cc --version

      - name: Configure
        # MOS_CLI_PROBE defaults ON, so the diagnostic 'mos probe'
        # subcommand TU (cli/probe.c — Apple-only, callback-heavy) is
        # compiled and contract-tested on every push instead of
        # bitrotting behind an opt-in flag (the fate the standalone
        # probe tools were rescued from, 2026-06-11).
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (library, CLI, tests)
        run: cmake --build build --parallel

      - name: Run unit tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Watch-lifetime guard (link + headless run)
        # tests/test_watch_lifetime.c pins the watch-event string-lifetime
        # contract under ASan, but only a Mac with a drive gives real
        # coverage — headless it SKIPs (exit 0). Linking and running it
        # here keeps the guard from bitrotting (it is in no CMake target)
        # and proves the whole compile/link chain on every push; the
        # hardware run stays a manual step in the integration matrix.
        run: |
          set -e
          cc -std=c11 -O1 -fsanitize=address,undefined \
             -fno-omit-frame-pointer -fno-sanitize-recover=all \
             -I include tests/test_watch_lifetime.c \
             build/libmos.a build/libmos_pure.a \
             -framework IOKit -framework CoreFoundation \
             -framework DiscRecording -framework DiskArbitration \
             -o /tmp/test_watch_lifetime
          ASAN_OPTIONS=abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
             /tmp/test_watch_lifetime

      - name: DR doorbell guard (driveless registration)
        # mos_watch_open_all registers the DiscRecording notification
        # doorbell and fails the open if registration is rejected; zero
        # drives is a valid empty stream, so this run on a driveless
        # runner proves the DRNotificationCenter registration calls are
        # accepted by the macOS API on every push. Callback DELIVERY
        # still needs a device appearing — that stays on the rig.
        run: |
          set -e
          cc -std=c11 -O1 -fsanitize=address,undefined \
             -fno-omit-frame-pointer -fno-sanitize-recover=all \
             -I include tests/test_dr_doorbell.c \
             build/libmos.a build/libmos_pure.a \
             -framework IOKit -framework CoreFoundation \
             -framework DiscRecording -framework DiskArbitration \
             -o /tmp/test_dr_doorbell
          ASAN_OPTIONS=abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
             /tmp/test_dr_doorbell

      - name: DR identity hygiene guard (complete-or-empty CF copies)
        # mos_dr.c copies DiscRecording's identity strings, the media BSD
        # name, and the IORegistry path out of CF dictionaries that, per
        # scope-doctrine layer 4, can carry adversarial bytes. The strict
        # copy is complete-or-empty (the shared interior-NUL / over-width
        # rule) so a severed or over-wide value can never become a truncated
        # false identity or a fabricated non-zero registry_id. This pins that
        # contract against real CoreFoundation on every push (it is in no
        # CMake target).
        run: |
          set -e
          cc -std=c11 -O1 -fsanitize=address,undefined \
             -fno-omit-frame-pointer -fno-sanitize-recover=all \
             -I include tests/test_dr_hygiene.c \
             build/libmos.a build/libmos_pure.a \
             -framework IOKit -framework CoreFoundation \
             -framework DiscRecording -framework DiskArbitration \
             -o /tmp/test_dr_hygiene
          ASAN_OPTIONS=abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
             /tmp/test_dr_hygiene

      - name: Run CLI smoke check
        run: |
          set -e
          build/bin/mos --version
          build/bin/mos --help

          # v0.3 plain-text contract on no-drive: empty stdout, diagnostic
          # to stderr, exit 66 (EX_NOINPUT). The "unknown" string is now
          # reserved for queried-but-unclassifiable results; hard failures
          # produce no stdout output at all.
          set +e
          OUT=$(build/bin/mos --index 99 2>/dev/null)
          EC=$?
          set -e
          if [ "$EC" != "66" ]; then
            echo "Expected exit 66 (EX_NOINPUT), got $EC"
            exit 1
          fi
          if [ -n "$OUT" ]; then
            echo "Expected empty stdout on plain-text hard failure, got: $OUT"
            exit 1
          fi

          # v0.3 JSON contract on no-drive: mos.error.v1 envelope on
          # stdout, structured nested error object, exit 66. JSON-mode
          # failures route to stdout so jq pipelines see them.
          set +e
          OUT=$(build/bin/mos --json --index 99 2>/dev/null)
          EC=$?
          set -e
          if [ "$EC" != "66" ]; then
            echo "Expected exit 66 on --json --index 99, got $EC"
            exit 1
          fi
          echo "$OUT" | grep -q '"schema": *"mos.error.v1"' || {
            echo "Expected mos.error.v1 schema in error envelope, got: $OUT"
            exit 1
          }
          echo "$OUT" | grep -q '"exit_code": *66' || {
            echo "Expected exit_code 66 in envelope, got: $OUT"
            exit 1
          }
          echo "OK: v0.3 CLI contract smoke check passed"

      - name: Probe-retired build (MOS_CLI_PROBE=OFF)
        # Keeps the retirement path compiling — flipping the option
        # default OFF is the documented way to retire 'mos probe', so
        # the OFF configuration must stay green — and pins the OFF
        # binary's diagnostic: 'probe' is recognized but rejected with
        # exit 64 and a rebuild hint, not the unknown-subcommand text.
        run: |
          set -e
          cmake -B build-noprobe -DCMAKE_BUILD_TYPE=Release -DMOS_CLI_PROBE=OFF
          cmake --build build-noprobe --target mos --parallel
          set +e
          ERR=$(build-noprobe/bin/mos probe disk4 2>&1 >/dev/null)
          EC=$?
          set -e
          if [ "$EC" != "64" ]; then
            echo "Expected exit 64 from 'probe' on a MOS_CLI_PROBE=OFF build, got $EC"
            exit 1
          fi
          echo "$ERR" | grep -q "not built into this binary" || {
            echo "Expected the not-built diagnostic, got: $ERR"
            exit 1
          }
          echo "OK: MOS_CLI_PROBE=OFF build compiles and rejects 'probe' correctly"

      - name: DiskArbitration opt-out build (MOS_USE_DISKARBITRATION=OFF)
        # Folded into this already-running macOS job rather than a
        # dedicated runner: the opt-out only changes when mos_da.c or the
        # DA wiring does, so a whole macOS runner per push is not worth
        # it. Keeps the stub path in mos_da.c compiling and proves the
        # framework is genuinely dropped from the link (otool) — every
        # other macOS build exercises the default ON path.
        run: |
          set -e
          cmake -B build-noda -DCMAKE_BUILD_TYPE=Release -DMOS_USE_DISKARBITRATION=OFF
          cmake --build build-noda --target mos --parallel
          if otool -L build-noda/bin/mos | grep -i DiskArbitration; then
            echo "ERROR: DiskArbitration linked despite MOS_USE_DISKARBITRATION=OFF"
            exit 1
          fi
          echo "OK: MOS_USE_DISKARBITRATION=OFF build compiles and links no DiskArbitration"

      - name: Verify public symbol hygiene
        # Both static libraries must export only symbols prefixed `mos_`
        # or `_mos_` (Mach-O underscored convention). Anything else means
        # an internal helper wasn't marked static or prefixed properly.
        # We check both libmos.a (mos_core, IOKit-linked) and
        # libmos_pure.a (mos_pure, framework-free) separately because
        # the v0.2 split made them sibling archives — internal-helper
        # leakage in either is a hygiene failure.
        run: |
          set -e
          for libname in libmos.a libmos_pure.a; do
            LIB=$(find build -name "$libname" | head -1)
            if [ -z "$LIB" ]; then
              echo "Could not locate $libname — failing"
              exit 1
            fi
            echo "Checking symbols in $LIB"
            BAD=$(nm -g --defined-only "$LIB" 2>/dev/null \
                  | awk '$2 == "T" || $2 == "D" || $2 == "S" { print $3 }' \
                  | grep -Ev '^_?mos_' \
                  | grep -Ev '^(ltmp|__)' || true)
            if [ -n "$BAD" ]; then
              echo "Non-mos_ public symbols found in $libname:"
              echo "$BAD"
              exit 1
            fi
          done
          echo "OK: all exported symbols across both archives are mos_-prefixed"

      - name: Verify no orphaned tests
        # Every TEST() fixture must be RUN()-registered in the same file's
        # register_*_tests(). Catches a fixture that compiles, links, and
        # silently never runs (surfaced empirically:
        # tests/test_sense.c::sense_04_04_maps_to_loading ran zero times for
        # several iterations). The logic lives in one script so CI and the
        # local pre-push preflight (scripts/preflight.sh) run the identical
        # gate.
        run: ./scripts/check-test-registration.sh

      - name: Amalgamation script produces compilable output
        run: |
          # Content staleness: regenerate to a scratch dir and diff against
          # the committed dist/. Single source of truth for this gate — the
          # local pre-push preflight (scripts/preflight.sh) runs the same
          # `--check`, so a stale dist/ is normally caught before the push.
          ./scripts/amalgamate.sh --check

          # Tracked-ness: the content diff above can't see a dist/ that has
          # been gitignored or never committed (the file may exist on disk
          # and match). The embedder contract requires these committed, so
          # assert git tracks all three.
          git ls-files --error-unmatch dist/mos.c dist/mos.h dist/MANIFEST.txt >/dev/null
          echo "OK: committed dist/ matches regeneration and is tracked"

          # (a) Compile-only check: source parses and type-checks.
          # -mmacosx-version-min=12.0 matches the documented direct-consumer
          # path and what the strict-adapter job pins. Without it here, CI
          # could silently exercise a different deployment target than what
          # downstream users will see when following our integration docs.
          cc -c dist/mos.c -Idist \
             -mmacosx-version-min=12.0 \
             -o /tmp/amalgamated.o
          echo "OK: amalgamated build compiles clean"

          # (b) Link + run the full test suite against the amalgamated
          # .o, using dist/mos.h as the sole header the test harness
          # sees. This catches awk-fragility issues (header-collapse
          # accidents, dropped includes, double-include guards) that
          # the compile-only check misses.
          #
          # Tests reach into src/ for internal prototypes, but the
          # library contract for external embedders is: `dist/mos.c`
          # and `dist/mos.h`, plus IOKit/CoreFoundation at link time.
          # This job exercises that contract.
          #
          # The pure-suite test files are GLOBBED — tests/test_*.c minus the
          # macOS adapter/integration suites (their own harnesses, not part of
          # the unit suite) — so a new test TU is picked up with no edit here.
          # The list lives once in CMakeLists.txt's mos_tests target; this no
          # longer keeps a second copy (a missing entry used to fail the link
          # with an undefined register_* symbol). Same philosophy as the
          # strict-adapter job's cli/*.c glob.
          pure_tests=$(ls tests/test_*.c | grep -vE 'tests/test_(adapter_|watch_lifetime|dr_doorbell|dr_hygiene)')
          cc -std=c11 -Wall -Wextra -Werror \
             -Idist -Isrc -Itests \
             -mmacosx-version-min=12.0 \
             cli/human.c cli/io.c \
             $pure_tests \
             /tmp/amalgamated.o \
             -framework IOKit -framework CoreFoundation \
             -framework DiscRecording -framework DiskArbitration \
             -o /tmp/amalgamated_tests
          /tmp/amalgamated_tests
          echo "OK: amalgamated test suite passes"

  sanitizers:
    name: Sanitizer build (ASan + UBSan)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (Node 24)
        with:
          persist-credentials: false

      - name: Configure with sanitizers
        # -O1 keeps inlining sane for stack traces while still exercising
        # optimizer-affected paths. -fno-omit-frame-pointer is required
        # for usable ASan reports. We enable on both compiler and linker
        # because libasan/libubsan have to be in the link line.
        run: |
          cmake -B build-san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-O1 -fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-san --parallel

      - name: Run tests under sanitizers
        # ASAN_OPTIONS=detect_leaks=0 because Apple's libasan doesn't
        # ship LSan; setting this avoids a misleading runtime warning
        # without weakening the actual ASan checks (use-after-free,
        # heap-buffer-overflow, stack-buffer-overflow, etc.).
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        working-directory: build-san
        run: ctest --output-on-failure

  lint-homebrew:
    name: Homebrew formula audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (Node 24)
        with:
          persist-credentials: false
      - name: brew style
        run: brew style homebrew/mos.rb || true
        # `|| true` until the first tag is pushed and url/sha256 are filled.

  schemas:
    name: JSON Schema validation
    # Schema validation is pure Python — no IOKit needed. Runs on
    # Ubuntu in parallel with the macOS jobs so a schema/emitter
    # drift fails CI fast without waiting for the build matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (Node 24)
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0 (Node 24)
        with:
          # Pinned, not '3.x': requirements-ci.txt hash-pins rpds-py
          # 0.20.0, whose newest prebuilt wheels stop at cp312/cp313 —
          # a newer interpreter forces an sdist build that fails (its
          # PyO3 doesn't know the new ABI). Bump together with the
          # requirements file.
          python-version: '3.12'

      - name: Install jsonschema (hash-pinned)
        # --require-hashes refuses to install any package whose downloaded
        # bytes don't match one of the listed SHA-256 digests. The
        # requirements file pins jsonschema and every transitive dep.
        # See schemas/requirements-ci.txt for regeneration steps.
        run: pip install --require-hashes -r schemas/requirements-ci.txt

      - name: Validate examples and negative fixtures
        # The script asserts:
        #   - every schemas/examples/*.json validates against its schema
        #   - every schemas/negative/*.json is rejected by its schema
        # Both directions matter — a too-permissive schema would
        # silently allow drift. See schemas/README.md.
        run: python3 schemas/validate.py

      - name: Check README examples track the schemas and emit_human
        # The ADR requires the README contract section to move with any
        # schema shape change; this enforces it. Every JSON block in
        # README.md is checked against schemas/mos.*.v*.json, and every
        # `$ mos <verb>` human pair block against cli/<verb>.c emit_human
        # (label rename / reorder / drop), and every `mos <verb>` /
        # `mos.*.v<n>` token in prose resolves. See schemas/check_readme.py.
        run: |
          python3 schemas/check_readme.py --selftest
          python3 schemas/check_readme.py

  nub-invariant:
    # Exhaustive proof of the ARCHITECTURE §5.5 nub invariant: the real
    # decision tree vs an independent kernel predicate transcribed from
    # PollForMedia. MOS_NUB_STATUS_SET=1 restricts the status loop to
    # the behaviorally-distinct SAM-5 set (the input PATH is identical;
    # only the redundant status octets are skipped) so the job stays
    # fast; the full 268M-input run is the documented one-liner in
    # tests/audit/nub_invariant_check.c. Exit 1 = invariant violated;
    # exit 2 = the checker's own transcription is stale (fix the
    # checker, then re-judge).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (Node 24)
        with:
          persist-credentials: false
      - name: build and run nub invariant checker
        run: |
          set -e
          # Link the checker against CMake's mos_pure archive rather than a
          # hand-copied pure-source list — MOS_PURE_SOURCES is the single
          # source of truth, so a new pure TU is included with no edit here.
          cmake -B build-nub >/dev/null
          cmake --build build-nub --target mos_pure
          cc -std=c11 -O2 -I include -I src \
             tests/audit/nub_invariant_check.c \
             build-nub/libmos_pure.a \
             -o /tmp/nub
          MOS_NUB_STATUS_SET=1 /tmp/nub

  strict-pure-build:
    # The default CMake build uses -Wall -Wextra -Wpedantic at the
    # warning level the project considers reasonable for ongoing
    # development. This job runs the same pure-layer sources under
    # release-grade optimization (-O2) with stricter -Werror flags
    # that catch class-of-bug issues the development settings let
    # through — most notably -Wformat-truncation, which under -O2's
    # value-range analysis surfaces snprintf-into-fixed-buffer
    # patterns that could theoretically overflow.
    #
    # A regression added in v0.3-dev was caught by this exact
    # invocation, well after the change landed under the default
    # warning level. Codifying it as a CI step prevents the same
    # gap from reopening silently.
    name: Strict pure build (-O2 -Werror, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (Node 24)
        with:
          persist-credentials: false

      - name: Build pure tests under -O2 -Werror
        run: |
          set -e
          # Drive CMake's mos_tests target (MOS_PURE_SOURCES + the test list,
          # both defined once in CMakeLists.txt) with the strict flags riding
          # CMAKE_C_FLAGS — so there is no second source list here to drift
          # out of sync with the build. -Wshadow/-Wconversion/-Wsign-conversion
          # catch class-of-bug issues the default level lets through;
          # -fanalyzer is deliberately NOT here (version-dependent false
          # positives make it a human tool, not a gate).
          cmake -B build-strict \
            -DCMAKE_C_FLAGS="-O2 -Wall -Wextra -Wpedantic -Wshadow -Wconversion -Wsign-conversion -Werror"
          cmake --build build-strict --target mos_tests
          ./build-strict/bin/mos_tests

  strict-adapter-build:
    # macOS adapter TUs compiled with stricter -Werror flags than the
    # default CMake mos_warnings interface. The cli/ sources are GLOBBED
    # (cli/*.c in the loop below), not hand-listed: the verb set's source
    # of truth is main.c's dispatch table (and the cli/ directory itself),
    # so a verb added or renamed there is picked up here with no edit —
    # there is no second copy of the file list to keep in sync. The src/
    # ADAPTER set is the one thing still listed explicitly, on purpose: it
    # is the IOKit-linked layer (mos_scsi/query/watch/state/dr/da plus the
    # raw-CDB verb TUs drive_inquiry/tray) that Linux CI cannot
    # compile, and it changes only on a deliberate architectural event,
    # unlike verbs which are added routinely. Keep this list in lockstep with
    # MOS_CORE_BASE_SOURCES in CMakeLists.txt.
    #
    # The glob also sweeps in the pure-API verbs (cli/metadata.c,
    # cli/drive.c, cli/features.c, cli/tray.c, cli/capacity.c). That is
    # safe, not a regression: they reach the adapter only through the
    # public mos.h API and contain no Apple SDK types, so this leg's
    # SDK-signature -Werror classes structurally cannot fire in them — and
    # every -Werror here is a specific `-Werror=<class>`, never a blanket
    # -Werror, so a stray -Wextra/-Wpedantic remark is a warning, not a
    # failure. Compiling them is a few cheap standalone -c invocations that
    # replace a curated exclude-list nobody could mechanically verify.
    # cli/probe.c gets -DMOS_CLI_PROBE (the ON preprocessor path; the OFF
    # path is compiled by the build-and-test job's MOS_CLI_PROBE=OFF leg).
    # The extra
    # flags target classes of bug that Linux CI can never see because
    # they involve Apple SDK signatures:
    #
    #   -Werror=incompatible-function-pointer-types
    #     Apple changes a callback signature in a future SDK
    #     release (e.g. an extra parameter on DA's
    #     DARegisterDiskDescriptionChangedCallback). Our
    #     registration call would compile with a warning under
    #     default settings; this promotes it to an error.
    #
    #   -Werror=int-conversion
    #     A newer header silently narrows a kIO* constant or a
    #     mach_port_t variant. Default warnings catch most of
    #     this but -Werror makes it loud.
    #
    #   -Werror=return-type
    #     Defensive — function that drops a `return` under
    #     conditional-compile of an updated header should fail
    #     the build, not silently return whatever's in the
    #     register.
    #
    # Pinned to -mmacosx-version-min=12.0 to match the CMake
    # CMAKE_OSX_DEPLOYMENT_TARGET, so the compile sees exactly
    # the SDK shape the release build uses.
    name: Strict adapter build (-Werror SDK drift, macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (Node 24)
        with:
          persist-credentials: false

      - name: Compile macOS adapter TUs with stricter -Werror
        run: |
          set -e
          mkdir -p /tmp/strict-adapter
          for src in src/mos_scsi.c src/mos_query.c src/mos_watch.c src/mos_state.c \
                     src/mos_dr.c src/mos_da.c \
                     src/mos_drive_inquiry.c src/mos_tray.c \
                     cli/*.c \
                     tests/test_watch_lifetime.c; do
            obj="/tmp/strict-adapter/$(basename "$src" .c).o"
            echo "--- $src ---"
            cc -std=c11 -Wall -Wextra -Wpedantic \
               -Werror=implicit-function-declaration \
               -Werror=incompatible-function-pointer-types \
               -Werror=int-conversion \
               -Werror=return-type \
               -mmacosx-version-min=12.0 \
               -DMOS_CLI_PROBE=1 \
               -I include -I src \
               -c "$src" -o "$obj"
          done

  doc-staleness:
    # Tripwire for documentation drift. The 2026-06-10 audit found the
    # machine-checked layer fully consistent while prose docs lagged the
    # 2026-05-30 redesign in ~15 places; this job is the missing forcing
    # function. Deny-list semantics documented in the script.
    name: Doc staleness gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (Node 24)
        with:
          persist-credentials: false
      - name: Grep live docs for known-stale markers
        run: sh scripts/doc-staleness.sh

      - name: CONTRIBUTING.md file tree tracks the repo
        # The "Code layout" tree in CONTRIBUTING.md is hand-maintained and
        # drifts the moment a new src/cli/script/schema file lands without a
        # line (it did — ~14 src files were missing). Forward + reverse check
        # against git-tracked files; pure stdlib, no pip. Edit the tree to fix.
        run: python3 scripts/check-file-tree.py

      - name: CLI docs track the command table
        # completions/{mos.bash,_mos,mos.fish} and the SUBCOMMANDS block of
        # man/mos.1 are generated from the command table (each cli/<verb>.c
        # descriptor + cli/main.c's array + cli/tray.c actions). Regenerate and
        # diff against the committed files so a new verb/flag can't ship with
        # stale completions or man page. Same regenerate-and-diff shape as the
        # amalgamate --check gate; pure stdlib, no pip. Run `make cli-docs` and
        # commit to fix drift.
        run: python3 scripts/gen-cli-docs.py --check

  lint-scripts:
    # Lint the shell scripts and workflow YAML — the build-system surface
    # that has no compiler to catch its mistakes. shellcheck guards the
    # scripts (unquoted vars, the fragile shell that the dist/preflight
    # gates are themselves made of); yamllint guards this file and the
    # other YAML (indentation — which in YAML changes meaning — duplicate
    # keys, tabs, trailing space) under the GHA-tuned .yamllint config.
    #
    # Supply-chain posture matches the rest of the repo: no new marketplace
    # action; shellcheck is the runner-provided system tool (like cc and
    # cmake, which this repo also takes from the image); yamllint is a
    # Python package, so it is hash-pinned with --require-hashes exactly
    # like jsonschema in the schemas job.
    name: Lint shell + YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (Node 24)
        with:
          persist-credentials: false
      - name: shellcheck (runner-provided)
        run: shellcheck scripts/*.sh tests/*.sh .githooks/pre-push
      - name: drive-model extraction cases
        run: sh tests/drive_model_cases.sh
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0 (Node 24)
        with:
          python-version: '3.12'
      - name: Install yamllint (hash-pinned)
        run: pip install --require-hashes -r .github/requirements-lint.txt
      - name: yamllint workflow + config YAML
        run: yamllint -c .yamllint .github/workflows/ci.yml .github/dependabot.yml .yamllint

  fuzz-pure:
    # Run the pure-layer fuzz harness under ASan+UBSan on Linux. The
    # harness links mos_pure only (no IOKit), so it builds and runs here.
    # Iteration counts are kept to a CI smoke via the MOS_FUZZ_* env knobs;
    # a finding aborts the process (-fno-sanitize-recover=all) and fails
    # the job. A fixed seed keeps failures reproducible. Previously this
    # harness existed only as a hand-run binary the build graph didn't
    # know about; this job puts it under CI.
    name: Fuzz pure layer (ASan+UBSan, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (Node 24)
        with:
          persist-credentials: false

      - name: Build and run fuzz_pure (smoke)
        env:
          MOS_FUZZ_SENSE: "300000"
          MOS_FUZZ_ESC: "120000"
          MOS_FUZZ_BSD: "300000"
          MOS_FUZZ_CFG: "120000"
          MOS_FUZZ_DISCINFO: "120000"
          MOS_FUZZ_TRUST: "120000"
          MOS_FUZZ_TOC: "120000"
          ASAN_OPTIONS: "abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1"
        run: |
          set -e
          cmake -B build-fuzz -DMOS_BUILD_FUZZ=ON -DMOS_BUILD_TESTS=OFF \
            -DCMAKE_C_FLAGS="-O1 -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-fuzz --target fuzz_pure
          # Fixed seed for reproducibility; a finding aborts and fails CI.
          ./build-fuzz/bin/fuzz_pure 1

  adapter-fake:
    # Runs the REAL one-shot adapter TUs (mos_scsi.c / mos_state.c /
    # mos_dr.c) headless against a link-seam fake of IOKit +
    # DiscRecording, fed committed MMC fixtures — adapter behaviour that
    # is otherwise unverified until a drive is attached. Phase 1 of
    # doc/research/2026-06-11-headless-adapter-emulation.md. macOS only:
    # the fake populates real SCSITaskLib vtable structs, which exist
    # only in the macOS SDK. Built under ASan/UBSan so a refcount or
    # lifetime slip in the adapter (or the fake) aborts the run.
    name: Adapter fake (headless, macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (Node 24)
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0 (Node 24)
        with:
          # Pinned to 3.12 to match the schemas job: requirements-ci.txt
          # hash-pins rpds-py 0.20.0, whose newest wheels stop at
          # cp312/cp313. Used by the emit-and-validate step below.
          python-version: '3.12'

      - name: Configure + build + run (ASan/UBSan)
        env:
          ASAN_OPTIONS: "abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1"
        run: |
          set -e
          cmake -B build-adapter -DMOS_BUILD_ADAPTER_FAKE=ON -DMOS_BUILD_TESTS=OFF \
            -DCMAKE_C_FLAGS="-O1 -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          # Probe first: it gates the phase-2 mechanisms (time seam,
          # CF interpose, run-loop delivery) and names a failed
          # mechanism in the log; canary thereafter.
          cmake --build build-adapter --target mos_adapter_seam_probe
          ./build-adapter/bin/mos_adapter_seam_probe
          cmake --build build-adapter --target mos_adapter_oneshot_tests
          ./build-adapter/bin/mos_adapter_oneshot_tests
          cmake --build build-adapter --target mos_adapter_watch_tests
          ./build-adapter/bin/mos_adapter_watch_tests

      - name: Emit-and-validate (CLI emit_json output vs schemas)
        # Builds the emit harness on the same ASan/UBSan fake seam and
        # validates each verb's REAL success-path JSON against the schema
        # it names — the guard the branch review added so emitter<->schema
        # drift fails CI instead of shipping (validate.py only sees
        # hand-written fixtures; the CLI contract test only error paths).
        env:
          ASAN_OPTIONS: "abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1"
        run: |
          set -e
          cmake --build build-adapter --target mos_emit_fixtures
          # Same hash-pinned jsonschema the ubuntu schema job uses.
          pip install --require-hashes -r schemas/requirements-ci.txt
          python3 tests/emit/validate_emitted.py \
            ./build-adapter/bin/mos_emit_fixtures schemas
          # Human-output golden check: same binary, `human` mode, compared
          # byte-for-byte to tests/emit/golden/*.txt. Catches emit_human
          # (cli/*.c) layout/vocabulary drift the JSON check above can't see.
          # Stdlib-only, no schema dependency.
          python3 tests/emit/validate_emitted_human.py \
            ./build-adapter/bin/mos_emit_fixtures

  coverage:
    # Pure-layer coverage (src/) from the host-independent unit suite.
    # The repo-wide number is the coverage-combined macOS job below; this
    # Linux leg reports only what runs without IOKit, and exists as the
    # fallback that survives without a macOS runner. The core layer and
    # CLI emitters show uncovered here — the combined report covers those.
    name: Coverage (pure layer, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (Node 24)
        with:
          persist-credentials: false

      - name: Install gcovr
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y gcovr

      - name: Configure + build with coverage instrumentation
        run: |
          set -e
          cmake -B build-cov -DCMAKE_BUILD_TYPE=Debug -DMOS_COVERAGE=ON
          cmake --build build-cov --parallel

      - name: Run unit tests (generates .gcda counters)
        working-directory: build-cov
        run: ctest --output-on-failure

      - name: Report coverage
        run: |
          set -eo pipefail
          gcovr --root . --object-directory build-cov \
            --filter 'src/' --print-summary 2>&1 | tee coverage.txt
          {
            echo '### Pure-layer coverage (Linux `unit` suite)';
            echo '';
            echo 'Scope: src/ via the host-independent unit tests only — the';
            echo 'IOKit core + CLI verbs are measured by the macOS adapter job.';
            echo '';
            echo '```';
            cat coverage.txt;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

  coverage-combined:
    # Authoritative repo-wide coverage (src/ + cli/): macOS is the only
    # runner that executes both the pure unit suite and the macOS-only
    # adapter/emit tests, so one llvm-cov build merges them into one number
    # (merging gcc and llvm-cov data cross-OS would need extra tooling for
    # a number macOS produces directly). Instrumentation rides
    # CMAKE_C_FLAGS, not MOS_COVERAGE: the adapter targets don't link
    # mos_warnings, so the option can't reach them. gcovr from a Homebrew
    # bottle; jsonschema --require-hashes; Actions SHA-pinned.
    name: Coverage (combined, macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (Node 24)
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0 (Node 24)
        with:
          # 3.12 to match the schemas/adapter jobs (requirements-ci.txt
          # hash-pins rpds-py 0.20.0, whose newest wheels stop at cp313).
          python-version: '3.12'

      - name: Install gcovr (Homebrew bottle)
        run: brew install gcovr

      - name: Configure + build all instrumented targets
        # Build only the test/adapter/emit targets, not the real `mos`
        # binary: cli/main.c, cli/watch.c, and cli/probe.c are driven only
        # by the macOS-gated shell contract test and would otherwise show
        # as misleadingly-bare lines.
        run: |
          set -e
          cmake -B build-cov -DMOS_BUILD_ADAPTER_FAKE=ON -DMOS_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-O0 -g --coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          cmake --build build-cov --target mos_tests
          cmake --build build-cov --target mos_adapter_oneshot_tests
          cmake --build build-cov --target mos_adapter_watch_tests
          cmake --build build-cov --target mos_emit_fixtures

      - name: Run all suites (generates .gcda counters)
        env:
          ASAN_OPTIONS: "abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1"
        run: |
          set -e
          ./build-cov/bin/mos_tests
          ./build-cov/bin/mos_adapter_oneshot_tests
          ./build-cov/bin/mos_adapter_watch_tests
          # Drive every emit verb/scenario through BOTH validators so the CLI
          # emitter + mos_result.c paths are exercised (and stay correct). The
          # JSON validator covers the emit_json paths; the human validator runs
          # the same scenarios in `human` mode so the cli/*.c emit_human
          # renderers are measured here too (the adapter-fake job already pins
          # them to goldens — this run is purely so they count toward coverage,
          # not bare lines that are tested-but-unmeasured).
          pip install --require-hashes -r schemas/requirements-ci.txt
          python3 tests/emit/validate_emitted.py \
            ./build-cov/bin/mos_emit_fixtures schemas
          python3 tests/emit/validate_emitted_human.py \
            ./build-cov/bin/mos_emit_fixtures

      - name: Report coverage
        run: |
          set -eo pipefail
          # gcov-ignore-errors: CMAKE_C_FLAGS instruments project-wide, so
          # CMake's compiler-detection probe TU emits counters gcovr can't
          # resolve to a source; skip those (the filter scopes the report).
          # xcrun, not bare llvm-cov: Apple ships it inside the Xcode
          # toolchain, off the default PATH.
          gcovr --root . --object-directory build-cov \
            --gcov-executable 'xcrun llvm-cov gcov' \
            --gcov-ignore-errors=no_working_dir_found \
            --filter 'src/' --filter 'cli/' \
            --print-summary 2>&1 | tee coverage.txt
          {
            echo '### Combined coverage (macOS — pure + IOKit core + CLI)';
            echo '';
            echo 'Authoritative repo-wide number: src/ + cli/ via the unit';
            echo 'suite AND the adapter-fake + emit-validate harness, merged';
            echo 'under one llvm-cov toolchain. The Linux `coverage` job';
            echo 'reports the pure layer alone as a standalone fallback.';
            echo '';
            echo '```';
            cat coverage.txt;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
