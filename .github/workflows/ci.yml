name: CI

on:
  # workflow_dispatch lets us trigger the macOS runner manually from
  # the GitHub UI — useful for verifying Apple-SDK-dependent changes
  # (e.g. notification probe, mos_watch) without having to push a
  # branch or open a PR. The Hamburg dev environment has no Mac, so
  # CI is the primary macOS build path.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default token scope to read-only. Nothing in this workflow writes to
# the repo (no pushes, no comments, no release artifacts at present).
# Scoping down GITHUB_TOKEN is the cheap version of supply-chain
# defense — if a transitive dependency in any action ever turns
# malicious, it can't use the token to push to main.
permissions:
  contents: read

# One run per ref: a superseded push cancels the in-flight run. CI
# correctness never depends on run ordering; this is queue hygiene
# and (pre-public it was) minute hygiene — macOS billed at 10x.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (macos-latest)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (Node 24)
        with:
          persist-credentials: false

      - name: Toolchain versions
        run: |
          cmake --version
          cc --version

      - name: Configure
        # MOS_CLI_PROBE defaults ON, so the diagnostic 'mos probe'
        # subcommand TU (cli/probe.c — Apple-only, callback-heavy) is
        # compiled and contract-tested on every push instead of
        # bitrotting behind an opt-in flag (the fate the standalone
        # probe tools were rescued from, 2026-06-11).
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (library, CLI, tests)
        run: cmake --build build --parallel

      - name: Run unit tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Watch-lifetime guard (link + headless run)
        # tests/test_watch_lifetime.c pins the watch-event string-lifetime
        # contract under ASan, but only a Mac with a drive gives real
        # coverage — headless it SKIPs (exit 0). Linking and running it
        # here keeps the guard from bitrotting (it is in no CMake target)
        # and proves the whole compile/link chain on every push; the
        # hardware run stays a manual step in the integration matrix.
        run: |
          set -e
          cc -std=c11 -O1 -fsanitize=address,undefined \
             -fno-omit-frame-pointer -fno-sanitize-recover=all \
             -I include tests/test_watch_lifetime.c \
             build/libmos.a build/libmos_pure.a \
             -framework IOKit -framework CoreFoundation \
             -framework DiscRecording \
             -o /tmp/test_watch_lifetime
          ASAN_OPTIONS=abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
             /tmp/test_watch_lifetime

      - name: DR doorbell guard (driveless registration)
        # mos_watch_open_all registers the DiscRecording notification
        # doorbell and fails the open if registration is rejected; zero
        # drives is a valid empty stream, so this run on a driveless
        # runner proves the DRNotificationCenter registration calls are
        # accepted by the macOS API on every push. Callback DELIVERY
        # still needs a device appearing — that stays on the rig.
        run: |
          set -e
          cc -std=c11 -O1 -fsanitize=address,undefined \
             -fno-omit-frame-pointer -fno-sanitize-recover=all \
             -I include tests/test_dr_doorbell.c \
             build/libmos.a build/libmos_pure.a \
             -framework IOKit -framework CoreFoundation \
             -framework DiscRecording \
             -o /tmp/test_dr_doorbell
          ASAN_OPTIONS=abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
             /tmp/test_dr_doorbell

      - name: Run CLI smoke check
        run: |
          set -e
          build/bin/mos --version
          build/bin/mos --help

          # v0.3 plain-text contract on no-drive: empty stdout, diagnostic
          # to stderr, exit 66 (EX_NOINPUT). The "unknown" string is now
          # reserved for queried-but-unclassifiable results; hard failures
          # produce no stdout output at all.
          set +e
          OUT=$(build/bin/mos --index 99 2>/dev/null)
          EC=$?
          set -e
          if [ "$EC" != "66" ]; then
            echo "Expected exit 66 (EX_NOINPUT), got $EC"
            exit 1
          fi
          if [ -n "$OUT" ]; then
            echo "Expected empty stdout on plain-text hard failure, got: $OUT"
            exit 1
          fi

          # v0.3 JSON contract on no-drive: mos.error.v1 envelope on
          # stdout, structured nested error object, exit 66. JSON-mode
          # failures route to stdout so jq pipelines see them.
          set +e
          OUT=$(build/bin/mos --json --index 99 2>/dev/null)
          EC=$?
          set -e
          if [ "$EC" != "66" ]; then
            echo "Expected exit 66 on --json --index 99, got $EC"
            exit 1
          fi
          echo "$OUT" | grep -q '"schema": *"mos.error.v1"' || {
            echo "Expected mos.error.v1 schema in error envelope, got: $OUT"
            exit 1
          }
          echo "$OUT" | grep -q '"exit_code": *66' || {
            echo "Expected exit_code 66 in envelope, got: $OUT"
            exit 1
          }
          echo "OK: v0.3 CLI contract smoke check passed"

      - name: Probe-retired build (MOS_CLI_PROBE=OFF)
        # Keeps the retirement path compiling — flipping the option
        # default OFF is the documented way to retire 'mos probe', so
        # the OFF configuration must stay green — and pins the OFF
        # binary's diagnostic: 'probe' is recognized but rejected with
        # exit 64 and a rebuild hint, not the unknown-subcommand text.
        run: |
          set -e
          cmake -B build-noprobe -DCMAKE_BUILD_TYPE=Release -DMOS_CLI_PROBE=OFF
          cmake --build build-noprobe --target mos --parallel
          set +e
          ERR=$(build-noprobe/bin/mos probe disk4 2>&1 >/dev/null)
          EC=$?
          set -e
          if [ "$EC" != "64" ]; then
            echo "Expected exit 64 from 'probe' on a MOS_CLI_PROBE=OFF build, got $EC"
            exit 1
          fi
          echo "$ERR" | grep -q "not built into this binary" || {
            echo "Expected the not-built diagnostic, got: $ERR"
            exit 1
          }
          echo "OK: MOS_CLI_PROBE=OFF build compiles and rejects 'probe' correctly"

      - name: DiskArbitration opt-out build (MOS_USE_DISKARBITRATION=OFF)
        # Folded into this already-running macOS job rather than a
        # dedicated runner: the opt-out only changes when mos_da.c or the
        # DA wiring does, so a whole macOS runner per push is not worth
        # it. Keeps the stub path in mos_da.c compiling and proves the
        # framework is genuinely dropped from the link (otool) — every
        # other macOS build exercises the default ON path.
        run: |
          set -e
          cmake -B build-noda -DCMAKE_BUILD_TYPE=Release -DMOS_USE_DISKARBITRATION=OFF
          cmake --build build-noda --target mos --parallel
          if otool -L build-noda/bin/mos | grep -i DiskArbitration; then
            echo "ERROR: DiskArbitration linked despite MOS_USE_DISKARBITRATION=OFF"
            exit 1
          fi
          echo "OK: MOS_USE_DISKARBITRATION=OFF build compiles and links no DiskArbitration"

      - name: Verify public symbol hygiene
        # Both static libraries must export only symbols prefixed `mos_`
        # or `_mos_` (Mach-O underscored convention). Anything else means
        # an internal helper wasn't marked static or prefixed properly.
        # We check both libmos.a (mos_core, IOKit-linked) and
        # libmos_pure.a (mos_pure, framework-free) separately because
        # the v0.2 split made them sibling archives — internal-helper
        # leakage in either is a hygiene failure.
        run: |
          set -e
          for libname in libmos.a libmos_pure.a; do
            LIB=$(find build -name "$libname" | head -1)
            if [ -z "$LIB" ]; then
              echo "Could not locate $libname — failing"
              exit 1
            fi
            echo "Checking symbols in $LIB"
            BAD=$(nm -g --defined-only "$LIB" 2>/dev/null \
                  | awk '$2 == "T" || $2 == "D" || $2 == "S" { print $3 }' \
                  | grep -Ev '^_?mos_' \
                  | grep -Ev '^(ltmp|__)' || true)
            if [ -n "$BAD" ]; then
              echo "Non-mos_ public symbols found in $libname:"
              echo "$BAD"
              exit 1
            fi
          done
          echo "OK: all exported symbols across both archives are mos_-prefixed"

      - name: Verify no orphaned tests
        # For each tests/test_*.c file that defines TEST() fixtures,
        # every defined fixture name must also appear in a RUN(name)
        # invocation within that same file. Catches the class of bug
        # where a test fixture is defined, compiles, gets included in
        # the test binary's source list, and silently does nothing
        # because nothing calls RUN() on it. Surfaced empirically:
        # tests/test_sense.c::sense_04_04_maps_to_loading shipped in
        # this state and ran zero times for several iterations.
        #
        # The check is per-file, not project-wide: a fixture in
        # test_sense.c registered from register_sense_tests() should
        # not need cross-file lookup. Test_main.c is exempt from the
        # TEST() side because it only calls register functions.
        run: |
          set -e
          FAIL=0
          for f in tests/test_*.c; do
            # Skip test_main.c — it dispatches to register functions
            # but defines no TEST() fixtures itself.
            if [ "$(basename "$f")" = "test_main.c" ]; then
              continue
            fi
            DEFINED=$(grep -E '^TEST\(' "$f" | sed -E 's/^TEST\(([^)]+)\).*/\1/')
            if [ -z "$DEFINED" ]; then
              continue
            fi
            for name in $DEFINED; do
              # RUN() invocations live inside register_*_tests() in
              # the same file. The match is on the exact RUN(name);
              # pattern, indented under register_*_tests().
              if ! grep -qE "[[:space:]]+RUN\($name\);" "$f"; then
                echo "Orphaned test in $f: TEST($name) defined but not registered with RUN()"
                FAIL=1
              fi
            done
          done
          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "Each TEST() fixture must be invoked by a RUN() call in"
            echo "the same file's register_*_tests() function. See"
            echo "tests/test_sense.c::register_sense_tests for the pattern."
            exit 1
          fi
          echo "OK: all TEST() fixtures are registered"

      - name: Amalgamation script produces compilable output
        run: |
          ./scripts/amalgamate.sh

          # Committed dist/ must be byte-identical to regeneration. dist/
          # is the documented embedder artifact, so a stale committed copy
          # ships wrong code even while CI compiles a fresh one. Untracked
          # or gitignore-suppressed dist files fail too — the artifact
          # contract requires them committed.
          if [ -n "$(git status --porcelain --ignored=matching -- dist/)" ]; then
            git status --ignored=matching -- dist/
            git --no-pager diff -- dist/ | head -60
            echo "ERROR: dist/ is stale or untracked relative to scripts/amalgamate.sh output."
            echo "Run ./scripts/amalgamate.sh and commit the result."
            exit 1
          fi
          echo "OK: committed dist/ matches regeneration"

          # (a) Compile-only check: source parses and type-checks.
          # -mmacosx-version-min=12.0 matches the documented direct-consumer
          # path and what the strict-adapter job pins. Without it here, CI
          # could silently exercise a different deployment target than what
          # downstream users will see when following our integration docs.
          cc -c dist/mos.c -Idist \
             -mmacosx-version-min=12.0 \
             -o /tmp/amalgamated.o
          echo "OK: amalgamated build compiles clean"

          # (b) Link + run the full test suite against the amalgamated
          # .o, using dist/mos.h as the sole header the test harness
          # sees. This catches awk-fragility issues (header-collapse
          # accidents, dropped includes, double-include guards) that
          # the compile-only check misses.
          #
          # Tests reach into src/ for internal prototypes, but the
          # library contract for external embedders is: `dist/mos.c`
          # and `dist/mos.h`, plus IOKit/CoreFoundation at link time.
          # This job exercises that contract.
          cc -std=c11 -Wall -Wextra -Werror \
             -Idist -Isrc -Itests \
             -mmacosx-version-min=12.0 \
             cli/human.c \
             tests/test_main.c tests/test_sense.c \
             tests/test_bsd_name.c tests/test_scsi_status.c \
             tests/test_ioreturn.c \
             tests/test_state_core.c tests/test_watch_core.c \
             tests/test_render.c tests/test_human.c \
             tests/test_config.c tests/test_discinfo.c tests/test_discstruct.c \
             tests/test_result.c \
             /tmp/amalgamated.o \
             -framework IOKit -framework CoreFoundation \
             -framework DiscRecording -framework DiskArbitration \
             -o /tmp/amalgamated_tests
          # test_render.c registers the hostile-input render fixtures
          # via register_render_tests(); test_main.c calls that
          # registration function unconditionally. Omitting the .c
          # file fails the link (undefined symbol). Keep this list
          # in sync with the unit-test target in CMakeLists.txt.
          /tmp/amalgamated_tests
          echo "OK: amalgamated test suite passes"

  sanitizers:
    name: Sanitizer build (ASan + UBSan)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (Node 24)
        with:
          persist-credentials: false

      - name: Configure with sanitizers
        # -O1 keeps inlining sane for stack traces while still exercising
        # optimizer-affected paths. -fno-omit-frame-pointer is required
        # for usable ASan reports. We enable on both compiler and linker
        # because libasan/libubsan have to be in the link line.
        run: |
          cmake -B build-san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-O1 -fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-san --parallel

      - name: Run tests under sanitizers
        # ASAN_OPTIONS=detect_leaks=0 because Apple's libasan doesn't
        # ship LSan; setting this avoids a misleading runtime warning
        # without weakening the actual ASan checks (use-after-free,
        # heap-buffer-overflow, stack-buffer-overflow, etc.).
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        working-directory: build-san
        run: ctest --output-on-failure

  lint-homebrew:
    name: Homebrew formula audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (Node 24)
        with:
          persist-credentials: false
      - name: brew style
        run: brew style homebrew/mos.rb || true
        # `|| true` until the first tag is pushed and url/sha256 are filled.

  schemas:
    name: JSON Schema validation
    # Schema validation is pure Python — no IOKit needed. Runs on
    # Ubuntu in parallel with the macOS jobs so a schema/emitter
    # drift fails CI fast without waiting for the build matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (Node 24)
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0 (Node 24)
        with:
          # Pinned, not '3.x': requirements-ci.txt hash-pins rpds-py
          # 0.20.0, whose newest prebuilt wheels stop at cp312/cp313 —
          # a newer interpreter forces an sdist build that fails (its
          # PyO3 doesn't know the new ABI). Bump together with the
          # requirements file.
          python-version: '3.12'

      - name: Install jsonschema (hash-pinned)
        # --require-hashes refuses to install any package whose downloaded
        # bytes don't match one of the listed SHA-256 digests. The
        # requirements file pins jsonschema and every transitive dep.
        # See schemas/requirements-ci.txt for regeneration steps.
        run: pip install --require-hashes -r schemas/requirements-ci.txt

      - name: Validate examples and negative fixtures
        # The script asserts:
        #   - every schemas/examples/*.json validates against its schema
        #   - every schemas/negative/*.json is rejected by its schema
        # Both directions matter — a too-permissive schema would
        # silently allow drift. See schemas/README.md.
        run: python3 schemas/validate.py

  nub-invariant:
    # Exhaustive proof of the ARCHITECTURE §5.5 nub invariant: the real
    # decision tree vs an independent kernel predicate transcribed from
    # PollForMedia. MOS_NUB_STATUS_SET=1 restricts the status loop to
    # the behaviorally-distinct SAM-5 set (the input PATH is identical;
    # only the redundant status octets are skipped) so the job stays
    # fast; the full 268M-input run is the documented one-liner in
    # tests/audit/nub_invariant_check.c. Exit 1 = invariant violated;
    # exit 2 = the checker's own transcription is stale (fix the
    # checker, then re-judge).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (Node 24)
        with:
          persist-credentials: false
      - name: build and run nub invariant checker
        run: |
          set -e
          cc -std=c11 -O2 -I include -I src \
             tests/audit/nub_invariant_check.c \
             src/mos_pure.c src/mos_sense.c src/mos_strings.c \
             src/mos_state_core.c src/mos_watch_core.c \
             src/mos_config.c src/mos_discinfo.c src/mos_discstruct.c src/mos_result.c \
             -o /tmp/nub
          MOS_NUB_STATUS_SET=1 /tmp/nub

  strict-pure-build:
    # The default CMake build uses -Wall -Wextra -Wpedantic at the
    # warning level the project considers reasonable for ongoing
    # development. This job runs the same pure-layer sources under
    # release-grade optimization (-O2) with stricter -Werror flags
    # that catch class-of-bug issues the development settings let
    # through — most notably -Wformat-truncation, which under -O2's
    # value-range analysis surfaces snprintf-into-fixed-buffer
    # patterns that could theoretically overflow.
    #
    # A regression added in v0.3-dev was caught by this exact
    # invocation, well after the change landed under the default
    # warning level. Codifying it as a CI step prevents the same
    # gap from reopening silently.
    name: Strict pure build (-O2 -Werror, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (Node 24)
        with:
          persist-credentials: false

      - name: Build pure tests under -O2 -Werror
        run: |
          set -e
          mkdir -p /tmp/strict
          # -Wshadow -Wconversion -Wsign-conversion: the third review
          # verified the pure layer clean under these (rare for C);
          # the gate owns the property so it stays true. -fanalyzer is
          # deliberately NOT here — version-dependent false positives
          # make it a human tool, not a gate.
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic \
             -Wshadow -Wconversion -Wsign-conversion -Werror \
             -I include -I src -I tests \
             src/mos_pure.c src/mos_sense.c src/mos_strings.c \
             src/mos_state_core.c src/mos_watch_core.c \
             src/mos_config.c src/mos_discinfo.c src/mos_discstruct.c src/mos_result.c \
             cli/human.c \
             tests/test_main.c tests/test_sense.c tests/test_bsd_name.c \
             tests/test_scsi_status.c tests/test_ioreturn.c \
             tests/test_state_core.c tests/test_watch_core.c \
             tests/test_render.c tests/test_human.c \
             tests/test_config.c tests/test_discinfo.c tests/test_discstruct.c tests/test_result.c \
             -o /tmp/strict/mos_tests_strict
          /tmp/strict/mos_tests_strict

  strict-adapter-build:
    # macOS adapter TUs compiled with stricter -Werror flags than the
    # default CMake mos_warnings interface. As of v0.4.0-dev the list
    # is: src/mos_scsi.c, src/mos_watch.c, src/mos_state.c, src/mos_dr.c, src/mos_da.c,
    # and the cli/ sources (cli/probe.c compiled with -DMOS_CLI_PROBE,
    # the ON preprocessor path; the OFF path is compiled by the
    # build-and-test job's MOS_CLI_PROBE=OFF leg).
    # The extra
    # flags target classes of bug that Linux CI can never see because
    # they involve Apple SDK signatures:
    #
    #   -Werror=incompatible-function-pointer-types
    #     Apple changes a callback signature in a future SDK
    #     release (e.g. an extra parameter on DA's
    #     DARegisterDiskDescriptionChangedCallback). Our
    #     registration call would compile with a warning under
    #     default settings; this promotes it to an error.
    #
    #   -Werror=int-conversion
    #     A newer header silently narrows a kIO* constant or a
    #     mach_port_t variant. Default warnings catch most of
    #     this but -Werror makes it loud.
    #
    #   -Werror=return-type
    #     Defensive — function that drops a `return` under
    #     conditional-compile of an updated header should fail
    #     the build, not silently return whatever's in the
    #     register.
    #
    # Pinned to -mmacosx-version-min=12.0 to match the CMake
    # CMAKE_OSX_DEPLOYMENT_TARGET, so the compile sees exactly
    # the SDK shape the release build uses.
    name: Strict adapter build (-Werror SDK drift, macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (Node 24)
        with:
          persist-credentials: false

      - name: Compile macOS adapter TUs with stricter -Werror
        run: |
          set -e
          mkdir -p /tmp/strict-adapter
          for src in src/mos_scsi.c src/mos_watch.c src/mos_state.c \
                     src/mos_dr.c src/mos_da.c \
                     cli/main.c cli/common.c cli/status.c cli/list.c \
                     cli/watch.c cli/human.c cli/io.c cli/probe.c \
                     tests/test_watch_lifetime.c; do
            obj="/tmp/strict-adapter/$(basename "$src" .c).o"
            echo "--- $src ---"
            cc -std=c11 -Wall -Wextra -Wpedantic \
               -Werror=implicit-function-declaration \
               -Werror=incompatible-function-pointer-types \
               -Werror=int-conversion \
               -Werror=return-type \
               -mmacosx-version-min=12.0 \
               -DMOS_CLI_PROBE=1 \
               -I include -I src \
               -c "$src" -o "$obj"
          done

  doc-staleness:
    # Tripwire for documentation drift. The 2026-06-10 audit found the
    # machine-checked layer fully consistent while prose docs lagged the
    # 2026-05-30 redesign in ~15 places; this job is the missing forcing
    # function. Deny-list semantics documented in the script.
    name: Doc staleness gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (Node 24)
        with:
          persist-credentials: false
      - name: Grep live docs for known-stale markers
        run: sh scripts/doc-staleness.sh

  fuzz-pure:
    # Run the pure-layer fuzz harness under ASan+UBSan on Linux. The
    # harness links mos_pure only (no IOKit), so it builds and runs here.
    # Iteration counts are kept to a CI smoke via the MOS_FUZZ_* env knobs;
    # a finding aborts the process (-fno-sanitize-recover=all) and fails
    # the job. A fixed seed keeps failures reproducible. Previously this
    # harness existed only as a hand-run binary the build graph didn't
    # know about; this job puts it under CI.
    name: Fuzz pure layer (ASan+UBSan, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (Node 24)
        with:
          persist-credentials: false

      - name: Build and run fuzz_pure (smoke)
        env:
          MOS_FUZZ_SENSE: "300000"
          MOS_FUZZ_ESC: "120000"
          MOS_FUZZ_BSD: "300000"
          MOS_FUZZ_CFG: "120000"
          MOS_FUZZ_DISCINFO: "120000"
          MOS_FUZZ_TRUST: "120000"
          MOS_FUZZ_TOC: "120000"
          ASAN_OPTIONS: "abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1"
        run: |
          set -e
          cmake -B build-fuzz -DMOS_BUILD_FUZZ=ON -DMOS_BUILD_TESTS=OFF \
            -DCMAKE_C_FLAGS="-O1 -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-fuzz --target fuzz_pure
          # Fixed seed for reproducibility; a finding aborts and fails CI.
          ./build-fuzz/bin/fuzz_pure 1

  adapter-fake:
    # Runs the REAL one-shot adapter TUs (mos_scsi.c / mos_state.c /
    # mos_dr.c) headless against a link-seam fake of IOKit +
    # DiscRecording, fed committed MMC fixtures — adapter behaviour that
    # is otherwise unverified until a drive is attached. Phase 1 of
    # doc/research/2026-06-11-headless-adapter-emulation.md. macOS only:
    # the fake populates real SCSITaskLib vtable structs, which exist
    # only in the macOS SDK. Built under ASan/UBSan so a refcount or
    # lifetime slip in the adapter (or the fake) aborts the run.
    name: Adapter fake (headless, macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (Node 24)
        with:
          persist-credentials: false

      - name: Configure + build + run (ASan/UBSan)
        env:
          ASAN_OPTIONS: "abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1"
        run: |
          set -e
          cmake -B build-adapter -DMOS_BUILD_ADAPTER_FAKE=ON -DMOS_BUILD_TESTS=OFF \
            -DCMAKE_C_FLAGS="-O1 -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          # Probe first: it gates the phase-2 mechanisms (time seam,
          # CF interpose, run-loop delivery) and names a failed
          # mechanism in the log; canary thereafter.
          cmake --build build-adapter --target mos_adapter_seam_probe
          ./build-adapter/bin/mos_adapter_seam_probe
          cmake --build build-adapter --target mos_adapter_oneshot_tests
          ./build-adapter/bin/mos_adapter_oneshot_tests
          cmake --build build-adapter --target mos_adapter_watch_tests
          ./build-adapter/bin/mos_adapter_watch_tests
